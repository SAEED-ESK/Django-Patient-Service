<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        حذف بیمار {{ patient.id }}
    </title>

</head>


<body>


    <!-- =====================================================
         عنوان
         ===================================================== -->

    <h1>
        حذف پرونده بیمار
    </h1>


    <!-- =====================================================
         پیام هشدار
         ===================================================== -->

    <p>

        آیا مطمئن هستید که می‌خواهید پرونده بیمار شماره
        <strong>
            {{ patient.id }}
        </strong>

        را حذف کنید؟

    </p>


    <p>
        این عملیات قابل بازگشت نیست.
    </p>


    <!-- =====================================================
         فرم حذف
         ===================================================== -->

    <form method="post">

        {% csrf_token %}


        <button type="submit">
            بله، حذف شود
        </button>


        <a href="{% url 'patient-detail' patient.id %}">
            انصراف
        </a>

    </form>


</body>

</html>
